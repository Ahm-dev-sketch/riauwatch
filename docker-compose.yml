# RIAUWATCH Docker Compose for local development
# NOTE: This is for Docker-capable environments.
# Current dev machine uses local PostgreSQL without PostGIS;
# integration tests are gated and skip when DATABASE_URL is unset/unreachable.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: riauwatch-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-riauwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-riauwatch}
      POSTGRES_DB: ${POSTGRES_DB:-riauwatch}
    ports:
      - "5432:5432"
    volumes:
      - riauwatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-riauwatch} -d ${POSTGRES_DB:-riauwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  riauwatch_pgdata: